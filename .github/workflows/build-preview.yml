name: Preview Build (EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Ziel-Plattform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

# Erlaubt dem Workflow, die projectId nach dem ersten `eas init`
# zurueck ins Repo zu committen.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.inputs.platform }} Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # PAT-ersatz nicht noetig, GITHUB_TOKEN mit contents:write reicht.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Init EAS Project (nur beim ersten Lauf)
        run: |
          if [ -z "$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")" ]; then
            echo "Kein projectId gefunden, initialisiere EAS..."
            eas init --non-interactive --force
          else
            echo "projectId bereits gesetzt, überspringe eas init"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Commit projectId zurück ins Repo (falls neu)
        run: |
          if git diff --quiet app.json; then
            echo "Keine Änderung an app.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: EAS projectId hinterlegt"
            git push
          fi

      - name: Build via EAS starten
        run: eas build --platform ${{ github.event.inputs.platform }} --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wo geht's weiter
        run: |
          echo "::notice title=Build gestartet::Der Build läuft jetzt in der Expo-Cloud. Fortschritt siehst du unter https://expo.dev → dein Projekt → Builds. Du bekommst eine Push-Notification wenn er fertig ist (~15 Min), und einen QR-Code / Download-Link zum Installieren."
