name: OTA Update (EAS)

on:
  # Manuell auslösbar über den Actions-Tab in GitHub
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update-Channel (muss zum Build passen)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      message:
        description: 'Kurz was geändert wurde'
        required: false
        default: 'UI-Feinschliff'
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Push OTA-Update auf Channel ${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Update pushen
        run: eas update --branch ${{ github.event.inputs.branch }} --message "${{ github.event.inputs.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Info für den User
        run: |
          echo "::notice title=Update gepusht::Das Update ist live. Deine bestehende App holt es beim nächsten Öffnen automatisch (kann auch schon während der App-Nutzung reinladen). Kein Neu-Installieren nötig."
